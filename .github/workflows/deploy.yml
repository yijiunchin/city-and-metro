# push 到 main 時自動測試、建置並部署到 Cloudflare Workers（city-and-metro.yijiun.com）。
# 需要在 GitHub 儲存庫設定 secret：CLOUDFLARE_API_TOKEN（帳號 ID 已寫在 wrangler.jsonc）。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'yijiunchin/city-and-metro'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 測試
        run: |
          node scripts/test-web-sync.mjs
          node scripts/test-map-migrations.mjs
          node scripts/test-v22.mjs
          node scripts/test-v23.mjs
          node scripts/test-v24.mjs
          node scripts/test-v25.mjs
          node scripts/test-v251.mjs
          node scripts/test-development-layer.mjs
          node scripts/test-save-storage.mjs

      - name: 建置 dist
        run: node scripts/build.mjs

      - name: 確認建置沒有改動已提交的檔案
        run: git diff --exit-code

      - name: 套用 D1 資料表遷移
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: d1 migrations apply city-and-metro --remote

      - name: 部署
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: deploy
